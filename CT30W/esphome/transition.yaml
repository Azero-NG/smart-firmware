esphome:
  name: ct30w-open
  friendly_name: CT30W Open IR Bridge
  includes:
    - boot_compat.h
    - eboot_sector.h
    - eboot_migration.h
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            disable_extra4k_at_link_time();
            ct30w_log_eboot_status();

esp8266:
  board: esp_wroom_02
  board_flash_mode: dout
  early_pin_init: false
  restore_from_flash: false

external_components:
  - source:
      type: local
      path: components
    components: [ct30w_stock_ota]

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: CT30W-Open-Setup
    password: !secret fallback_ap_password

captive_portal:

ct30w_stock_ota:
  id: stock_ota

api:
  reboot_timeout: 0s
  actions:
    - action: send_nec
      variables:
        address: int
        command: int
      then:
        - remote_transmitter.transmit_nec:
            address: !lambda return address;
            command: !lambda return command;
            command_repeats: 1
    - action: stock_boot_rollback
      variables:
        url: string
      then:
        - lambda: |-
            if (!id(stock_ota).start(url)) {
              ESP_LOGE("ct30w.stock_ota", "Rollback request rejected");
            }
    - action: migrate_eboot
      variables:
        expected_size: int
        expected_crc: string
      then:
        - lambda: |-
            if (!ct30w_migrate_eboot(expected_size, expected_crc)) {
              ESP_LOGE("ct30w.eboot", "Migration request rejected");
            }

ota:
  - platform: esphome

remote_transmitter:
  id: ir_tx
  pin: GPIO14
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO5
    inverted: true
    mode: INPUT_PULLUP
  dump: all
  tolerance: 50%
  filter: 50us
  idle: 10ms
  buffer_size: 2kb

output:
  - platform: gpio
    id: white_led_output
    pin: GPIO15

light:
  - platform: binary
    id: white_led
    name: White LED
    output: white_led_output

binary_sensor:
  - platform: gpio
    id: board_button
    name: Board Button
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - light.toggle: white_led

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
